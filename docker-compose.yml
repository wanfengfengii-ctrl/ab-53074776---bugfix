services:
  api:
    build:
      context: ./api
      target: runtime
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性回归服务：用交付镜像同一 CPython 与 app.scanner 跑 api 单元测试
  # （含暴力最优性对照、稳定决胜检查与无冲突扫描内存回归），跑完即退出，
  # 退出码即回归结果；verify 仅在它成功退出后才会启动。
  api-tests:
    build:
      context: ./api
      target: test
    restart: "no"

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：对真实运行的 web/api 跑验收测试后退出
  verify:
    build: ./verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      api-tests:
        condition: service_completed_successfully
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web
    restart: "no"
